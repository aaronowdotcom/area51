appId: com.nexaflow.saleskit
productName: NexaFlow Sales Kit
copyright: Copyright © 2025 NexaFlow Inc.

directories:
  output: dist
  buildResources: build-resources

files:
  - electron/**/*
  - renderer/out/**/*
  - java-service/target/saleskit-service.jar
  - resources/**/*
  - package.json

extraResources:
  - from: resources/jdk
    to: jdk
    filter:
      - "**/*"
  - from: java-service/target/saleskit-service.jar
    to: saleskit-service.jar

mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  icon: build-resources/icon.icns

win:
  target:
    - nsis
  icon: build-resources/icon.ico

linux:
  target:
    - AppImage
  icon: build-resources/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
