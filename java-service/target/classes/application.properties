# -------------------------------------------------------
# Common config — shared across all environments
# Environment-specific files override values below
# -------------------------------------------------------

# Server
server.port=7878

# App info
app.name=NexaFlow Sales Kit
app.version=1.0.0
app.environment=local

# CORS — comma-separated list of allowed origins
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.saleskit=INFO
logging.level.root=WARN
logging.pattern.console=%d{HH:mm:ss} [%p] %logger{36} - %msg%n
