# -------------------------------------------------------
# UAT (User Acceptance Testing)
# Activate: java -jar saleskit-service.jar --spring.profiles.active=uat
# -------------------------------------------------------

app.environment=UAT

# Allow local + UAT server
app.cors.allowed-origins=http://localhost:3000,http://uat.nexaflow.internal:3000

# Moderate logging — enough to diagnose UAT issues
logging.level.saleskit=INFO
logging.level.org.springframework.web=WARN
logging.level.root=WARN
