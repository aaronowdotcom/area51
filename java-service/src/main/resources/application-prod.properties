# -------------------------------------------------------
# PROD (Production — salesperson's laptop)
# Activate: java -jar saleskit-service.jar --spring.profiles.active=prod
# -------------------------------------------------------

app.environment=PROD

# Only accept requests from the local Next.js server
app.cors.allowed-origins=http://localhost:3000

# Minimal logging in production
logging.level.saleskit=WARN
logging.level.root=ERROR
