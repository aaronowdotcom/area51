# -------------------------------------------------------
# SIT (System Integration Testing)
# Activate: java -jar saleskit-service.jar --spring.profiles.active=sit
# -------------------------------------------------------

app.environment=SIT

# Allow local dev + SIT server
app.cors.allowed-origins=http://localhost:3000,http://sit.nexaflow.internal:3000

# Verbose logging for debugging integration issues
logging.level.saleskit=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.root=INFO
